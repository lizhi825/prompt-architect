<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词架构师</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="titlebar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 5h16v3H4zM4 10.5h11v3H4zM4 16h7v3H4z" fill="currentColor"/></svg></span>
      <span class="brand-name">提示词架构师</span>
      <span class="brand-sub">Prompt Architect</span>
    </div>
    <div class="title-actions">
      <button id="btn-settings" class="icon-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.9 1.9-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-2.7v-.1A1.7 1.7 0 0 0 11.2 19.3a1.7 1.7 0 0 0-1.88.34l-.06.06-1.9-1.9.06-.06A1.7 1.7 0 0 0 7.76 15 1.7 1.7 0 0 0 6.2 13.97H6v-2.7h.1A1.7 1.7 0 0 0 7.76 10.2a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.9-1.9.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 12.23 5V4.9h2.7V5a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.9 1.9-.06.06a1.7 1.7 0 0 0-.34 1.88v.1a1.7 1.7 0 0 0 1.56 1.03H21v2.7h-.1A1.7 1.7 0 0 0 19.4 15z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button id="btn-hide" class="icon-btn" title="隐藏 (Esc)" aria-label="隐藏">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="statusbar">
    <span id="status-text">已就绪 · 说出需求</span>
    <span class="status-hint" id="hotkey-hint">Alt+Space 呼出</span>
  </div>

  <main class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-title">说出你要做的事</div>
      <div class="welcome-desc">我不直接给答案。我会反问几个项目相关的问题，然后生成一份<strong>别的 Agent 能直接执行</strong>的完整提示词文件。</div>
      <button class="welcome-eg" data-eg="把客服群消息自动汇总成周报">试试：把客服群消息自动汇总成周报</button>
      <button class="welcome-eg" data-eg="给我们的项目写一份 README">试试：给我们的项目写一份 README</button>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <footer class="composer">
    <div class="composer-row">
      <textarea id="input" rows="1" placeholder="说出需求，或输入 /help 查看命令"></textarea>
      <button id="btn-voice" class="round-btn" title="语音输入" aria-label="语音输入">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-send" class="round-btn primary" title="发送" aria-label="发送">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12l16-8-5 8 5 8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="composer-actions">
      <button class="chip-btn accent" id="btn-gen">一键生成 /gen</button>
      <button class="chip-btn" id="btn-reset">重置</button>
      <button class="chip-btn" id="btn-copy-last">复制产物</button>
      <span class="spacer"></span>
      <span class="tip">Enter 发送</span>
    </div>
  </footer>

  <aside class="settings" id="settings">
    <div class="settings-head">
      <span>设置</span>
      <button id="btn-settings-close" class="icon-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <label class="field">
        <span>DeepSeek API Key</span>
        <input type="password" id="cfg-key" placeholder="sk-..." autocomplete="off">
        <em>只保存在本机用户目录，不上传</em>
      </label>
      <label class="field">
        <span>API Base URL</span>
        <input type="text" id="cfg-base" placeholder="https://api.deepseek.com">
        <em>任意 OpenAI 兼容端点均可</em>
      </label>
      <label class="field">
        <span>模型</span>
        <input type="text" id="cfg-model" placeholder="deepseek-chat" list="model-list">
        <datalist id="model-list"><option value="deepseek-chat"><option value="deepseek-reasoner"></datalist>
      </label>
      <label class="field">
        <span>温度</span>
        <input type="number" id="cfg-temp" min="0" max="1" step="0.1" value="0.3">
      </label>
      <label class="field">
        <span>全局热键</span>
        <input type="text" id="cfg-hotkey" placeholder="Alt+Space">
        <em>如 Alt+Space / Ctrl+Shift+P，保存后立即生效</em>
      </label>
      <label class="field">
        <span>开机自启动</span>
        <span class="checkline"><input type="checkbox" id="cfg-autolaunch"> 静默启动并驻留托盘，用热键呼出</span>
        <em>写入当前用户登录项，不需要管理员权限</em>
      </label>
      <label class="field">
        <span>语音引擎</span>
        <select id="cfg-asr-engine">
          <option value="browser">浏览器语音识别（桌面版不可用）</option>
          <option value="custom">ASR 服务（推荐，国内可用）</option>
        </select>
        <em id="asr-browser-note">Electron 桌面版缺少 Google 语音服务，调用后无任何响应，请勿选此项。</em>
      </label>
      <div id="asr-custom-fields">
        <label class="field">
          <span>服务商预设</span>
          <select id="cfg-asr-preset">
            <option value="siliconflow">硅基流动 SenseVoice（国内，有免费额度）</option>
            <option value="groq">Groq Whisper（需海外网络）</option>
            <option value="openai">OpenAI Whisper</option>
            <option value="raw">本地 / 自定义服务（POST 原始音频）</option>
          </select>
          <em>选预设会自动填端点与模型，可再手动改端点接任意兼容服务</em>
        </label>
        <label class="field" id="field-asr-endpoint">
          <span>ASR 端点</span>
          <input type="text" id="cfg-asr-endpoint" placeholder="https://api.siliconflow.cn/v1/audio/transcriptions">
        </label>
        <label class="field" id="field-asr-model">
          <span>ASR 模型</span>
          <input type="text" id="cfg-asr-model" placeholder="FunAudioLLM/SenseVoiceSmall">
        </label>
        <label class="field" id="field-asr-key">
          <span>ASR API Key</span>
          <input type="password" id="cfg-asr-key" placeholder="sk-..." autocomplete="off">
          <em>只存本机；本地服务无需鉴权可留空</em>
        </label>
      </div>
      <div class="settings-actions">
        <button id="btn-save" class="btn-primary">保存设置</button>
        <button id="btn-quit" class="btn-ghost">退出应用</button>
      </div>
      <p class="settings-note" id="mode-note"></p>
    </div>
  </aside>

</div>
<script src="app.js"></script>
</body>
</html>
